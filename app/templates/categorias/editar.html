{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4 bg-white shadow-sm">
        <h4>Modificar Categoría</h4>
        <form method="POST" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Nombre de la Categoría:</label>
                <input type="text" name="nombre" value="{{ categoria.nombre }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="descripcion" rows="3" class="form-control" required>{{ categoria.descripcion }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
        </form>
    </div>
</div>
{% endblock %}
