{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4 card p-3 bg-white shadow-sm mb-3">
        <h5>Nueva Categoría</h5>
        <form method="POST">
            <div class="mb-2"><label>Nombre:</label><input type="text" name="nombre" class="form-control" required></div>
            <div class="mb-2"><label>Descripción:</label><textarea name="descripcion" class="form-control" rows="3"></textarea></div>
            <button type="submit" class="btn btn-success w-100 mt-2">Crear</button>
        </form>
    </div>
    <div class="col-md-8">
        <h5>Listado de Categorías</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark"><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
            <tbody>
                {% for c in categorias %}
                <tr>
                    <td><b>{{ c.nombre }}</b></td><td>{{ c.descripcion }}</td>
                    <td>
                        <a href="/categorias/editar/{{ c.id }}" class="btn btn-warning btn-sm">Editar</a>
                        <form action="/categorias/eliminar/{{ c.id }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
