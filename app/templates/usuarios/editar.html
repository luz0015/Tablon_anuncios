{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 card p-4 bg-white shadow-sm">
        <h5>Modificar Usuario: {{ usuario.username }}</h5>
        <form method="POST">
            <div class="mb-3"><label>Nombre de Usuario:</label><input type="text" name="username" value="{{ usuario.username }}" class="form-control" required></div>
            <div class="mb-3"><label>Email:</label><input type="email" name="email" value="{{ usuario.email }}" class="form-control" required></div>
            <div class="mb-3"><label>Nueva Contraseña (Opcional):</label><input type="password" name="password" class="form-control"></div>
            <button type="submit" class="btn btn-primary w-100">Guatdar cambios</button>
        </form>
    </div>
</div>
{% endblock %}
