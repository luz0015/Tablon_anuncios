{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4 card p-3 bg-white shadow-sm mb-3">
        <h5>Registrar Nuevo Usuario</h5>
        <form method="POST">
            <div class="mb-2"><label>Nombre de Usuario:</label><input type="text" name="username" class="form-control" required></div>
            <div class="mb-2"><label>Email:</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-2"><label>Contraseña:</label><input type="password" name="password" class="form-control" required></div><br>
            <button type="submit" class="btn btn-success w-100 mt-2">Guardar</button><br><br>
        </form>
    </div>
    <div class="col-md-8">
        <h5>Listado de Usuarios</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark"><tr><th>Usuario</th><th>Email</th><th>Acciones</th></tr></thead>
            <tbody>
                {% for u in usuarios %}
                <tr>
                    <td>{{ u.username }}</td><td>{{ u.email }}</td>
                    <td>
                        <a href="/usuarios/editar/{{ u.id }}" class="btn btn-warning btn-sm">Editar</a>
                        <form action="/usuarios/eliminar/{{ u.id }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
