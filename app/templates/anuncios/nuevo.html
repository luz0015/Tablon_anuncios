{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4 bg-white shadow-sm">
        <h4>Nuevo Anuncio</h4>
        <form method="POST" class="mt-3">
            <div class="mb-3">
                <label>Titulo del Anuncio:</label>
                <input type="text" name="titulo" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label>Asociar Categorías:</label>
                
                <select name="categoria_id[]" class="form-select" multiple size="1">
                    {% for c in categorias %}
                        <option value="{{ c.id }}">{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            
            </div>
            
            <div class="mb-3">
                <label>Contenido:</label>
                <textarea name="contenido" rows="5" class="form-control" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Publicar</button>
        </form>
    </div>
</div>
{% endblock %}
